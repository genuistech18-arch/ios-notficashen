workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Step 1 - Flutter pub get
        script: |
          cd mobile_app
          flutter pub get

      - name: Step 2 - Let Flutter migrate files (generates xcconfig and Podfile)
        script: |
          cd mobile_app
          # Run flutter build to generate Generated.xcconfig and upgrade Podfile
          # This will fail due to iOS 13 vs 15 issue - that's OK, we continue
          flutter build ios --release --no-codesign 2>&1 || true

      - name: Step 3 - Fix iOS deployment target
        script: |
          echo "=== Contents of ios/Flutter/ ==="
          ls -la mobile_app/ios/Flutter/ || echo "Directory not found"

          echo "=== Fixing Podfile ==="
          # Update platform to 15.0
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" mobile_app/ios/Podfile

          # Add or replace post_install to force 15.0 on all pods
          python3 - << 'PYEOF'
import re

with open('mobile_app/ios/Podfile', 'r') as f:
    content = f.read()

# Remove existing post_install block
content = re.sub(r'post_install do.*?^end\n', '', content, flags=re.DOTALL | re.MULTILINE)

# Add our post_install
content += """
post_install do |installer|
  installer.pods_project.targets.each do |target|
    flutter_additional_ios_build_settings(target) if defined?(flutter_additional_ios_build_settings)
    target.build_configurations.each do |config|
      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
    end
  end
end
"""

with open('mobile_app/ios/Podfile', 'w') as f:
    f.write(content)

print("Podfile updated successfully")
PYEOF

          echo "=== Fixing project.pbxproj ==="
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' \
            mobile_app/ios/Runner.xcodeproj/project.pbxproj

          echo "=== Updated Podfile platform line ==="
          grep "platform :ios" mobile_app/ios/Podfile

      - name: Step 4 - Pod install with iOS 15.0
        script: |
          cd mobile_app/ios
          pod install --repo-update

      - name: Step 5 - Final iOS build
        script: |
          cd mobile_app
          flutter build ios --release --no-codesign

    artifacts:
      - mobile_app/build/ios/iphoneos/Runner.app
