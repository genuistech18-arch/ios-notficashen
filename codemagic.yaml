workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    integrations:
      app_store_connect: apple_credentials
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Step 1 - Flutter pub get & Generate xcconfig
        script: |
          cd mobile_app
          flutter pub get
          flutter build ios-api-docs --release || flutter build ios --config-only || true
          mkdir -p ios/Flutter
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))" > ios/Flutter/Generated.xcconfig
            echo "FLUTTER_APPLICATION_PATH=$(pwd)" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_TARGET=lib/main.dart" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_DIR=build" >> ios/Flutter/Generated.xcconfig
          fi
          
          # Always fetch latest version/build number from pubspec.yaml
          VERSION_LINE=$(grep "version:" pubspec.yaml)
          BUILD_NAME=$(echo $VERSION_LINE | cut -d' ' -f2 | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $VERSION_LINE | cut -d'+' -f2)

          # Clean existing definitions and append the new ones to ensure they override Gradle/Xcode defaults
          sed -i '' '/FLUTTER_BUILD_NAME/d' ios/Flutter/Generated.xcconfig 2>/dev/null || true
          sed -i '' '/FLUTTER_BUILD_NUMBER/d' ios/Flutter/Generated.xcconfig 2>/dev/null || true
          echo "FLUTTER_BUILD_NAME=$BUILD_NAME" >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_BUILD_NUMBER=$BUILD_NUMBER" >> ios/Flutter/Generated.xcconfig

      - name: Step 2 - Create iOS 15.0 Podfile and fix Deployment Target
        script: |
          cd mobile_app
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" ios/Flutter/AppFrameworkInfo.plist || true

          cat > ios/Podfile << 'EOF'
          platform :ios, '15.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. Make sure flutter pub get is executed first."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}."
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.expand_path(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target) if defined?(flutter_additional_ios_build_settings)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

      - name: Step 3 - Pod install
        script: |
          cd mobile_app/ios
          pod install --repo-update

      - name: Step 4 - Code Sign and Build IPA (ALL IN ONE)
        script: |
          set -e

          echo "=== Step A: Initialize Keychain ==="
          keychain initialize

          echo "=== Step B: Generate fresh RSA private key ==="
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out $HOME/cert_key.pem 2>/dev/null
          echo "Private key generated successfully"

          echo "=== Step C: Fetch/Create signing files from Apple ==="
          app-store-connect fetch-signing-files "com.fatherpadg.app" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="$(cat $HOME/cert_key.pem)"

          echo "=== Step D: Add certificates to keychain ==="
          keychain add-certificates

          echo "=== Step E: Apply profiles to Xcode project ==="
          xcode-project use-profiles --project mobile_app/ios/Runner.xcodeproj

          echo "=== Step F: Build IPA ==="
          cd mobile_app
          VERSION_LINE=$(grep "version:" pubspec.yaml)
          BUILD_NAME=$(echo $VERSION_LINE | cut -d' ' -f2 | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $VERSION_LINE | cut -d'+' -f2)
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - mobile_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
